[project]
name = "pykuro"
version = "0.1.0"
description = "Null models, calibration and confounder tests for small epigraphic corpora"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
kuro = "kuro.cli:main"
