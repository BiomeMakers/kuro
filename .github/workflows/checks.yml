name: checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pytest
      - name: Tests
        run: PYTHONPATH=. python -m pytest tests -q
      - name: Manifest check
        run: python scripts/check_manifest.py --strict
